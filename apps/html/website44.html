<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eesho's Animated Website</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1d2671, #c33764);
      color: white;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    h1 {
      font-size: 3rem;
      animation: slideIn 2s ease-in-out;
    }

    p {
      font-size: 1.3rem;
      margin-top: 10px;
      animation: fadeIn 3s ease-in;
    }

    .btn {
      margin-top: 30px;
      padding: 12px 25px;
      font-size: 1.1rem;
      color: white;
      border: 2px solid white;
      border-radius: 25px;
      background: transparent;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover {
      background: white;
      color: #c33764;
      transform: scale(1.1);
    }

    @keyframes slideIn {
      from { transform: translateY(-100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

   
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      animation: float 15s infinite ease-in-out;
    }

    @keyframes float {
      from { transform: translateY(100vh) scale(0.5); }
      to { transform: translateY(-10vh) scale(1.2); }
    }
  </style>
</head>
<body>
  <h1>🚀 Welcome to Eesho’s Website 🚀</h1>
  <p>A simple animated site hosted on GitHub Pages!</p>
  <button class="btn" onclick="alert('Thanks for visiting bro 😎')">Click Me</button>


  <div class="circle" style="width:80px; height:80px; left:10%; animation-delay: 0s;"></div>
  <div class="circle" style="width:50px; height:50px; left:40%; animation-delay: 3s;"></div>
  <div class="circle" style="width:100px; height:100px; left:70%; animation-delay: 6s;"></div>
  <div class="circle" style="width:60px; height:60px; left:85%; animation-delay: 9s;"></div>
</body>
</html>
